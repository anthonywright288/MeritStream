<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="MeritStream">
  <defs>
    <linearGradient id="ms" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b5ef7" />
      <stop offset="1" stop-color="#32389f" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#ms)" />
  <!-- three merit signals converging -->
  <g stroke="#ffffff" stroke-width="11.6" stroke-linecap="round" fill="none">
    <path d="M18 27 L50 50" />
    <path d="M18 50 H50" />
    <path d="M18 73 L50 50" />
  </g>
  <!-- settled into one payout -->
  <circle cx="75" cy="50" r="14" fill="#81e7dd" />
</svg>
